[workspace]
resolver = "3"
members = ["crates/protocol", "crates/client", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/zerox80/totenrunde-mp-sdk"

[workspace.dependencies]
totenrunde-mp-protocol = { path = "crates/protocol", version = "0.1.0" }
totenrunde-mp-client = { path = "crates/client", version = "0.1.0" }
totenrunde-mp-server = { path = "crates/server", version = "0.1.0" }
